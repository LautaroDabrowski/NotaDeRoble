# Instalar en /etc/nginx/sites-available/institutoblazor.
# Este archivo va dentro del contexto http de Nginx (sites-enabled en Ubuntu).
map $http_upgrade $instituto_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name REEMPLAZAR_CON_DOMINIO_O_IP_DE_LA_VM;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $instituto_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
